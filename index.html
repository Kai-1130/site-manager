<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>工地管理</title>
<!-- PWA & Mobile settings -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<!-- Open Graph settings for Social Sharing -->
<meta property="og:title" content="工地管理">
<meta property="og:description" content="工地管理應用程式 (缺失、工安、材料)">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f2f2f7; }
.app { max-width: 480px; margin: 0 auto; padding: 12px; }
.header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.logo { width: 38px; height: 38px; background: #185FA5; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.module-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; margin-bottom: 14px; }
.module-btn { padding: 8px 2px; border: 2px solid #ddd; border-radius: 10px; background: #fff; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; color: #666; font-family: inherit; white-space: nowrap; }
.module-btn.mod-d { border-color:#185FA5; background:#185FA5; color:#fff; }
.module-btn.mod-s { border-color:#E67E22; background:#E67E22; color:#fff; }
.module-btn.mod-m { border-color:#27AE60; background:#27AE60; color:#fff; }
.module-btn.mod-p { border-color:#16A085; background:#16A085; color:#fff; }
.tab-bar { display: flex; gap: 6px; margin-bottom: 16px; }
.tab { flex:1; padding:9px 4px; border:1px solid #ccc; border-radius:10px; background:#fff; font-size:12px; cursor:pointer; text-align:center; color:#666; font-family:inherit; }
.tab.td { background:#185FA5; color:#fff; border-color:#185FA5; }
.tab.ts { background:#E67E22; color:#fff; border-color:#E67E22; }
.tab.tm { background:#27AE60; color:#fff; border-color:#27AE60; }
.tab.tp { background:#16A085; color:#fff; border-color:#16A085; }
.section { display:none; }
.card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,0.07); }
.field { margin-bottom:13px; }
.field label { display:block; font-size:12px; color:#666; margin-bottom:5px; font-weight:500; }
.field input,.field textarea,.field select { width:100%; padding:9px 11px; border:1px solid #ddd; border-radius:10px; font-size:15px; background:#fff; color:#111; -webkit-appearance:none; appearance:none; font-family:inherit; }
.field textarea { height:64px; resize:none; }
.type-chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px; }
.chip { display:inline-flex; align-items:center; gap:3px; padding:5px 11px; border-radius:999px; font-size:13px; background:#f0f0f0; border:1px solid #ddd; color:#444; cursor:pointer; user-select:none; }
.chip.cd { background:#185FA5; color:#fff; border-color:#185FA5; }
.chip.cs { background:#E67E22; color:#fff; border-color:#E67E22; }
.chip.cm { background:#27AE60; color:#fff; border-color:#27AE60; }
.chip-x { font-size:15px; line-height:1; color:#aaa; cursor:pointer; padding:0 2px; flex-shrink:0; }
.chip.cd .chip-x,.chip.cs .chip-x,.chip.cm .chip-x { color:rgba(255,255,255,0.75); }
.type-add-row { display:flex; gap:6px; margin-top:6px; }
.type-add-row input { flex:1; padding:7px 10px; border:1px solid #ddd; border-radius:8px; font-size:13px; font-family:inherit; }
.type-add-row button { padding:7px 12px; border:1px solid #185FA5; border-radius:8px; background:none; color:#185FA5; font-size:13px; cursor:pointer; font-family:inherit; white-space:nowrap; }
.pri-tags { display:flex; gap:6px; }
.pri-tag { flex:1; padding:8px 4px; border-radius:10px; border:2px solid #ddd; text-align:center; cursor:pointer; font-size:12px; font-weight:600; background:#fff; }
.sel-urgent { border-color:#C0392B; background:#FDECEA; color:#C0392B; }
.sel-high { border-color:#E67E22; background:#FEF3E2; color:#E67E22; }
.sel-normal { border-color:#27AE60; background:#EAF5EA; color:#27AE60; }
.sel-low { border-color:#aaa; background:#F5F5F5; color:#888; }
.photo-btn { width:100%; height:76px; border:1.5px dashed #bbb; border-radius:10px; background:#f7f7f7; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; color:#888; font-size:13px; }
.photo-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.week-strip { display:flex; justify-content:space-between; background:#fff; border-radius:14px; padding:12px 6px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.day-cell { flex:1; text-align:center; display:flex; flex-direction:column; gap:6px; }
.day-name { font-size:10px; color:#888; font-weight:600; }
.day-num { font-size:15px; font-weight:700; color:#333; width:30px; height:30px; display:flex; align-items:center; justify-content:center; margin:0 auto; border-radius:50%; transition:all 0.2s; }
.day-cell.today .day-num { background:#185FA5; color:#fff; box-shadow:0 2px 6px rgba(24,95,165,0.3); }
.day-cell.today .day-name { color:#185FA5; }

.photo-thumb { width:88px; height:88px; position:relative; cursor:pointer; flex-shrink:0; }
.photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; border-radius:10px; border:1px solid #ddd; }
.submit-btn { width:100%; padding:13px; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:500; cursor:pointer; margin-top:4px; font-family:inherit; }
.btn-d { background:#185FA5; } .btn-s { background:#E67E22; } .btn-m { background:#27AE60; } .btn-p { background:#16A085; }
.rcard { background:#fff; border-radius:14px; padding:13px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.07); border-left:4px solid #ddd; }
.rcard.pri-urgent { border-left-color:#C0392B; }
.rcard.pri-high { border-left-color:#E67E22; }
.rcard.pri-normal { border-left-color:#27AE60; }
.rcard.pri-low { border-left-color:#bbb; }
.rcard.cs-card { border-left-color:#E67E22; }
.rcard.cm-card { border-left-color:#27AE60; }
.rcard.cp-card { border-left-color:#16A085; }
.prog-wrap { width:100%; height:8px; background:#eee; border-radius:4px; overflow:hidden; margin-top:10px; position:relative; }
.prog-fill { height:100%; background:#16A085; transition:width 0.3s; }
.prog-header { display:flex; justify-content:space-between; font-size:11px; margin-top:10px; color:#666; font-weight:600; }
.rhdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:8px; }
.rtitle { font-size:15px; font-weight:600; color:#111; }
.badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; flex-shrink:0; }
.bp { background:#FAEEDA; color:#854F0B; }
.bd { background:#E6F1FB; color:#185FA5; }
.bpass { background:#EAF5EA; color:#27AE60; }
.bfail { background:#FDECEA; color:#C0392B; }
.bpart { background:#FEF3E2; color:#E67E22; }
.pri-badge { display:inline-block; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:600; margin-right:4px; }
.rmeta { font-size:12px; color:#888; margin-top:2px; }
.photo-row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 8px; }
.pw { position:relative; width:66px; height:66px; flex-shrink:0; }
.pw img { width:66px; height:66px; object-fit:cover; border-radius:8px; border:1px solid #ddd; display:block; cursor:pointer; }
.del-ph { position:absolute; top:-6px; right:-6px; width:20px; height:20px; background:#C0392B; color:#fff; border:none; border-radius:50%; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2; }
.ar { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.abtn { flex:1; min-width:50px; padding:8px 4px; font-size:11px; border:1px solid #ddd; border-radius:8px; background:#f5f5f5; cursor:pointer; color:#333; text-align:center; font-weight:600; font-family:inherit; }
.abtn:active { opacity:0.7; }
.filter-row { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.filter-row select { flex:1; min-width:80px; padding:8px 6px; border:1px solid #ddd; border-radius:10px; font-size:12px; background:#fff; color:#222; -webkit-appearance:none; appearance:none; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.stat { background:#fff; border-radius:12px; padding:12px 8px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.stat-num { font-size:24px; font-weight:700; color:#111; }
.stat-label { font-size:11px; color:#888; margin-top:2px; }
.exp-btn { width:100%; padding:13px; margin-bottom:10px; border:1px solid #ddd; border-radius:12px; background:#fff; font-size:14px; cursor:pointer; color:#222; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:500; box-shadow:0 1px 4px rgba(0,0,0,0.06); font-family:inherit; }
.exp-filter { display:flex; gap:6px; margin-bottom:10px; }
.exp-filter select { flex:1; padding:8px 10px; border:1px solid #ddd; border-radius:10px; font-size:13px; background:#fff; -webkit-appearance:none; appearance:none; }
.empty { text-align:center; padding:40px 0; color:#aaa; font-size:14px; }
.phlbl { font-size:12px; font-weight:600; margin:6px 0 4px; }
/* 編輯面板 */
.ep { background:#f7f7f7; border-radius:10px; padding:12px; margin-top:10px; }
.ep-lbl { font-size:11px; color:#666; display:block; margin-bottom:4px; font-weight:500; margin-top:8px; }
.ep-lbl:first-child { margin-top:0; }
.ep input,.ep select { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font-size:14px; background:#fff; margin-bottom:0; font-family:inherit; -webkit-appearance:none; appearance:none; color:#111; }
.ep textarea { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font-size:14px; background:#fff; font-family:inherit; color:#111; height:60px; resize:none; }
.ep-pri { display:flex; gap:5px; margin-top:0; }
.ep-pri-btn { flex:1; padding:7px 2px; border-radius:8px; border:2px solid #ddd; text-align:center; cursor:pointer; font-size:11px; font-weight:600; background:#fff; color:#888; }
.ep-add-ph { display:block; width:100%; padding:8px; border:1px dashed #bbb; border-radius:8px; text-align:center; font-size:12px; color:#888; cursor:pointer; margin-top:8px; }
.ep-save { width:100%; padding:10px; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:500; font-family:inherit; margin-top:10px; }
.result-row { display:flex; gap:8px; }
.rbtn { flex:1; padding:10px 4px; border:2px solid #ddd; border-radius:10px; text-align:center; cursor:pointer; font-size:12px; font-weight:600; background:#fff; color:#666; font-family:inherit; }
.r-pass { border-color:#27AE60; background:#EAF5EA; color:#27AE60; }
.r-fail { border-color:#C0392B; background:#FDECEA; color:#C0392B; }
.r-accept { border-color:#27AE60; background:#EAF5EA; color:#27AE60; }
.r-partial { border-color:#E67E22; background:#FEF3E2; color:#E67E22; }
.r-reject { border-color:#C0392B; background:#FDECEA; color:#C0392B; }
.lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
.lb.open { display:flex; }
.lb img { max-width:94vw; max-height:80vh; object-fit:contain; border-radius:6px; }
.lb-x { position:absolute; top:14px; right:18px; background:none; border:none; color:#fff; font-size:32px; cursor:pointer; }
.lb-nav { display:flex; gap:24px; margin-top:14px; }
.lb-nav button { background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:24px; padding:8px 18px; border-radius:8px; cursor:pointer; }
.lb-c { color:#ccc; font-size:12px; margin-top:8px; }
.dlg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center; }
.dlg.open { display:flex; }
.dlg-box { background:#fff; border-radius:16px; padding:24px 20px 16px; max-width:300px; width:90%; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.18); }
.dlg-title { font-size:16px; font-weight:700; color:#111; margin-bottom:8px; }
.dlg-msg { font-size:13px; color:#666; margin-bottom:20px; line-height:1.6; }
.dlg-btns { display:flex; gap:10px; }
.dlg-btn { flex:1; padding:11px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
.dlg-cancel { background:#f0f0f0; color:#444; }
.dlg-ok { color:#fff; }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; }
input[type="file"] { display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><path d="M9 12h6M9 16h4"/></svg>
    </div>
    <div>
      <div style="font-size:16px;font-weight:700;color:#111;" id="proj-display">工地管理</div>
    </div>
  </div>

  <div id="week-strip" class="week-strip"></div>


  <div class="module-bar">
    <button class="module-btn mod-d" id="mod-defect">📋 缺失管理</button>
    <button class="module-btn" id="mod-safety">🦺 工安巡檢</button>
    <button class="module-btn" id="mod-material">📦 材料驗收</button>
    <button class="module-btn" id="mod-progress">📅 工程進度</button>
  </div>

  <!-- ══ 缺失管理 ══ -->
  <div id="module-defect">
    <div class="tab-bar">
      <div class="tab td" id="dt-list-btn">缺失清單</div>
      <div class="tab" id="dt-add-btn">新增缺失</div>
      <div class="tab" id="dt-exp-btn">匯出報告</div>
    </div>
    <div class="section" id="dt-list">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="d-total">0</div><div class="stat-label">總計</div></div>
        <div class="stat"><div class="stat-num" style="color:#854F0B" id="d-pending">0</div><div class="stat-label">待改善</div></div>
        <div class="stat"><div class="stat-num" style="color:#185FA5" id="d-done">0</div><div class="stat-label">已完成</div></div>
      </div>
      <div class="filter-row">
        <select id="d-fs"><option value="">全部狀態</option><option value="pending">待改善</option><option value="done">驗收完成</option></select>
        <select id="d-fp"><option value="">全部緊急度</option><option value="urgent">🔴 緊急</option><option value="high">🟠 高</option><option value="normal">🟢 一般</option><option value="low">⚪ 低</option></select>
        <select id="d-ft"><option value="">全部類型</option></select>
      </div>
      <div id="defect-list"></div>
    </div>
    <div class="section" id="dt-add">
      <div class="card">
        <div class="field"><label>缺失位置</label><input type="text" id="d-loc" placeholder="例：3F 北側走廊"></div>
        <div class="field">
          <label>缺失類型 <span style="font-size:11px;color:#aaa;">（點 × 刪除）</span></label>
          <div class="type-chips" id="d-chips"></div>
          <div class="type-add-row"><input type="text" id="d-chip-inp" placeholder="新增自訂類型"><button id="d-chip-add">新增</button></div>
        </div>
        <div class="field">
          <label>優先緩急</label>
          <div class="pri-tags" id="d-pri">
            <div class="pri-tag sel-urgent" data-p="urgent">🔴 緊急</div>
            <div class="pri-tag" data-p="high">🟠 高</div>
            <div class="pri-tag" data-p="normal">🟢 一般</div>
            <div class="pri-tag" data-p="low">⚪ 低</div>
          </div>
        </div>
        <div class="field"><label>備註</label><textarea id="d-desc" placeholder="備註說明..."></textarea></div>
        <div class="field">
          <label>現況照片（可多選，自動標記日期）</label>
          <div class="photo-btn" id="d-ph-btn"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>點擊拍照 / 一次選多張</div>
          <input type="file" id="d-file" accept="image/*" multiple>
          <div class="photo-grid" id="d-preview"></div>
        </div>
        <button class="submit-btn btn-d" id="d-submit">新增缺失記錄</button>
      </div>
    </div>
    <div class="section" id="dt-exp">
      <div class="card">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">篩選匯出範圍</div>
        <div class="exp-filter">
          <select id="d-es"><option value="">全部狀態</option><option value="pending">僅待改善</option><option value="done">僅驗收完成</option></select>
          <select id="d-ep"><option value="">全部緊急度</option><option value="urgent">🔴 緊急</option><option value="high">🟠 高</option><option value="normal">🟢 一般</option><option value="low">⚪ 低</option></select>
        </div>
        <div id="d-ecount" style="font-size:12px;color:#888;margin-bottom:12px;"></div>
        <button class="exp-btn" id="d-word"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>匯出 Word（含照片，A4）</button>
        <button class="exp-btn" id="d-html"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>匯出 HTML（含照片放大）</button>
        <button class="exp-btn" id="d-csv"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>匯出 Excel（CSV）</button>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:10px;">工地資訊</div>
        <div class="field"><label>工地名稱</label><input type="text" id="proj-name" placeholder="XX大樓新建工程"></div>
        <div class="field"><label>工地主任</label><input type="text" id="proj-mgr" placeholder="姓名"></div>
        <div style="font-size:14px;font-weight:600;margin:12px 0 10px;">資料備份</div>
        <button class="exp-btn" id="btn-backup">📦 匯出備份（JSON）</button>
        <label class="exp-btn" style="cursor:pointer;">📥 還原備份（JSON）<input type="file" id="restore-inp" accept=".json"></label>
        <button class="exp-btn" id="btn-reset" style="color:#C0392B; border-color:#F5B7B1; background:#FDEDEC; margin-top:8px;">🗑️ 清空所有資料 (變空白)</button>
      </div>
    </div>
  </div>

  <!-- ══ 工安巡檢 ══ -->
  <div id="module-safety" style="display:none;">
    <div class="tab-bar">
      <div class="tab ts" id="st-form-btn">巡檢表單</div>
      <div class="tab" id="st-hist-btn">巡檢記錄</div>
    </div>
    <div class="section" id="st-form">
      <div class="card">
        <div class="field"><label>巡檢地點</label><input type="text" id="s-loc" placeholder="例：2F 施工區"></div>
        <div class="field">
          <label>巡檢項目 <span style="font-size:11px;color:#aaa;">（點 × 刪除）</span></label>
          <div class="type-chips" id="s-chips"></div>
          <div class="type-add-row"><input type="text" id="s-chip-inp" placeholder="新增自訂項目"><button id="s-chip-add" style="border-color:#E67E22;color:#E67E22;">新增</button></div>
        </div>
        <div class="field"><label>備註</label><textarea id="s-desc" placeholder="備註說明..."></textarea></div>
        <div class="field">
          <label>巡檢照片（可多選，自動標記日期）</label>

<div class="dlg" id="dlg"><div class="dlg-box"><div class="dlg-title" id="dlg-t">確認</div><div class="dlg-msg" id="dlg-m"></div><div class="dlg-btns"><button class="dlg-btn dlg-cancel" id="dlg-no">取消</button><button class="dlg-btn dlg-ok" id="dlg-yes">確定</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
// ══ 資料 ══
var defects    = JSON.parse(localStorage.getItem('defects')    || '[]');
var safetyLogs = JSON.parse(localStorage.getItem('safetyLogs') || '[]');
var matLogs    = JSON.parse(localStorage.getItem('matLogs')    || '[]');
var progLogs   = JSON.parse(localStorage.getItem('progLogs')   || '[]');
// 所有類型都存在 customTypes，預設類型也一樣，差別只是刪除後回到第一個
var dTypes = JSON.parse(localStorage.getItem('dTypes') || JSON.stringify(['二丁掛','地磚','泥作','結構','水電','裝修','安全','其他']));
var sTypes = JSON.parse(localStorage.getItem('sTypes') || JSON.stringify(['安全帽','安全網','施工架','圍欄','電氣安全','動火作業','個人防護']));
var mTypes = JSON.parse(localStorage.getItem('mTypes') || JSON.stringify(['鋼筋','混凝土','鋼材','木材','砂石','防水材料','磁磚','其他']));

var dType = dTypes[0], dPri = 'urgent', dPh = [];
var sType = sTypes[0], sRes = 'pass',   sPh = [];
var mType = mTypes[0], mRes = 'accept', mPh = [];
var dEditing = null;
var pEditing = null;

var PL = {urgent:'🔴 緊急',high:'🟠 高',normal:'🟢 一般',low:'⚪ 低'};
var PC = {urgent:'#C0392B',high:'#E67E22',normal:'#27AE60',low:'#888'};
var PB = {urgent:'#FDECEA',high:'#FEF3E2',normal:'#EAF5EA',low:'#F5F5F5'};
var PO = {urgent:0,high:1,normal:2,low:3};

function getPri(d){var p=d&&d.priority;return(p&&PL[p])?p:'normal';}
function todayStr(){var d=new Date();return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+('0'+d.getDate()).slice(-2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function saveD(){localStorage.setItem('defects',JSON.stringify(defects));}
function saveS(){localStorage.setItem('safetyLogs',JSON.stringify(safetyLogs));}
function saveM(){localStorage.setItem('matLogs',JSON.stringify(matLogs));}
function saveP(){localStorage.setItem('progLogs',JSON.stringify(progLogs));}
function saveDT(){localStorage.setItem('dTypes',JSON.stringify(dTypes));}
function saveST(){localStorage.setItem('sTypes',JSON.stringify(sTypes));}
function saveMT(){localStorage.setItem('mTypes',JSON.stringify(mTypes));}


// ── Toast ──
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

// ── 對話框 ──
var dlgCb=null;
function dlg(title,msg,okTxt,okColor,cb){
  document.getElementById('dlg-t').textContent=title||'確認';
  document.getElementById('dlg-m').textContent=msg;
  document.getElementById('dlg-yes').textContent=okTxt||'確定';
  document.getElementById('dlg-yes').style.background=okColor||'#C0392B';
  document.getElementById('dlg').classList.add('open');
  dlgCb=cb;
}
document.getElementById('dlg-no').addEventListener('click',function(){document.getElementById('dlg').classList.remove('open');dlgCb=null;});
document.getElementById('dlg-yes').addEventListener('click',function(){document.getElementById('dlg').classList.remove('open');if(dlgCb){dlgCb();dlgCb=null;}});

// ── 燈箱 ──
var lbArr=[],lbI=0;
function openLb(arr,i){lbArr=arr.slice();lbI=i;document.getElementById('lb-img').src=lbArr[lbI];document.getElementById('lb-c').textContent=(lbI+1)+' / '+lbArr.length;document.getElementById('lb').classList.add('open');}
document.getElementById('lb-x').addEventListener('click',function(){document.getElementById('lb').classList.remove('open');});
document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
document.getElementById('lb-p').addEventListener('click',function(){lbI=(lbI-1+lbArr.length)%lbArr.length;document.getElementById('lb-img').src=lbArr[lbI];document.getElementById('lb-c').textContent=(lbI+1)+' / '+lbArr.length;});
document.getElementById('lb-n').addEventListener('click',function(){lbI=(lbI+1)%lbArr.length;document.getElementById('lb-img').src=lbArr[lbI];document.getElementById('lb-c').textContent=(lbI+1)+' / '+lbArr.length;});

// ── 照片工具 ──
function stamp(src,cb){
  var d=todayStr();var img=new Image();img.onerror=function(){cb(src);};
  img.onload=function(){
    var c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    var ctx=c.getContext('2d');ctx.drawImage(img,0,0);
    var fs=Math.max(16,Math.round(img.width*0.045));
    ctx.font='bold '+fs+'px sans-serif';ctx.textAlign='right';
    var tw=ctx.measureText(d).width,pad=fs*0.5,x=img.width-pad,y=img.height-pad;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(x-tw-pad*1.5,y-fs-pad*0.5,tw+pad*3,fs+pad*1.2);
    ctx.fillStyle='#fff';ctx.fillText(d,x,y);cb(c.toDataURL('image/jpeg',0.88));
  };img.src=src;
}
function renderPreview(arr, previewId) {
  var p = document.getElementById(previewId);
  if (!p) return;
  p.innerHTML = '';
  arr.forEach(function(s, idx) {
    var w=document.createElement('div');
    w.className='photo-thumb';
    var img=document.createElement('img');img.src=s;
    img.addEventListener('click',function(){openLb(arr,idx);});
    w.appendChild(img);
    var db=document.createElement('button');db.className='del-ph';db.textContent='×';
    db.addEventListener('click',function(e){
      e.stopPropagation();
      arr.splice(idx, 1);
      renderPreview(arr, previewId);
    });
    w.appendChild(db);
    p.appendChild(w);
  });
}
function addFiles(files,arr,previewId){
  var pending = files.length;
  if(pending === 0) return;
  Array.from(files).forEach(function(f){
    var r=new FileReader();r.onload=function(e){stamp(e.target.result,function(s){
      arr.push(s);
      pending--;
      if(pending === 0 && previewId) renderPreview(arr, previewId);
    });};r.readAsDataURL(f);
  });
}
function dlBlob(blob,name){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);}

// ── 模組切換 ──
function switchMod(mod){
  ['defect','safety','material','progress'].forEach(function(m){
    document.getElementById('module-'+m).style.display=m===mod?'block':'none';
    document.getElementById('mod-'+m).className='module-btn'+(m===mod?' mod-'+m[0]:'');
  });
  if(mod==='defect'){renderDChips();switchDTab('list');}
  if(mod==='safety'){renderSChips();switchSTab('form');}
  if(mod==='material'){renderMChips();switchMTab('add');}
  if(mod==='progress'){switchPTab('list');}
}
document.getElementById('mod-defect').addEventListener('click',function(){switchMod('defect');});
document.getElementById('mod-safety').addEventListener('click',function(){switchMod('safety');});
document.getElementById('mod-material').addEventListener('click',function(){switchMod('material');});
document.getElementById('mod-progress').addEventListener('click',function(){switchMod('progress');});

// ── Chip 工具 ──
function mkChip(text, isActive, activeClass, onClick, onDel){
  var chip=document.createElement('div');
  chip.className='chip'+(isActive?' '+activeClass:'');
  var span=document.createElement('span');span.textContent=text;
  chip.appendChild(span);
  // 所有類型都可以刪除
  var x=document.createElement('span');x.className='chip-x';x.textContent='×';
  x.addEventListener('click',function(e){e.stopPropagation();onDel();});
  chip.appendChild(x);
  chip.addEventListener('click',onClick);
  return chip;
}

// ══════════════════════════════
// 缺失管理
// ══════════════════════════════
function switchDTab(t){
  ['list','add','exp'].forEach(function(n){
    document.getElementById('dt-'+n+'-btn').className='tab'+(t===n?' td':'');
    document.getElementById('dt-'+n).style.display=t===n?'block':'none';
  });
  if(t==='list')renderDList();
  if(t==='add'){renderDChips();syncDPri();}
  if(t==='exp')updateDExp();
}
document.getElementById('dt-list-btn').addEventListener('click',function(){switchDTab('list');});
document.getElementById('dt-add-btn').addEventListener('click',function(){switchDTab('add');});
document.getElementById('dt-exp-btn').addEventListener('click',function(){switchDTab('exp');});
switchDTab('list');

function renderDChips(){
  if(!dTypes.includes(dType)) dType=dTypes[0]||'';
  var c=document.getElementById('d-chips');c.innerHTML='';
  dTypes.forEach(function(t){
    c.appendChild(mkChip(t,t===dType,'cd',
      function(){dType=t;renderDChips();},
      function(){
        if(dTypes.length<=1){toast('⚠️ 至少保留一個類型');return;}
        dlg('刪除類型','確定刪除「'+t+'」？','確定刪除','#C0392B',function(){
          dTypes=dTypes.filter(function(x){return x!==t;});saveDT();
          if(dType===t)dType=dTypes[0];
          renderDChips();rebuildDFT();
        });
      }
    ));
  });
}
document.getElementById('d-chip-add').addEventListener('click',function(){
  var v=document.getElementById('d-chip-inp').value.trim();if(!v)return;
  if(!dTypes.includes(v)){dTypes.push(v);saveDT();}
  dType=v;document.getElementById('d-chip-inp').value='';renderDChips();rebuildDFT();
});
function rebuildDFT(){
  var s=document.getElementById('d-ft'),c=s.value;
  s.innerHTML='<option value="">全部類型</option>'+dTypes.map(function(t){return'<option value="'+t+'"'+(c===t?' selected':'')+'>'+t+'</option>';}).join('');
}

function syncDPri(){
  document.querySelectorAll('#d-pri .pri-tag').forEach(function(el){
    var p=el.getAttribute('data-p');el.className='pri-tag'+(dPri===p?' sel-'+p:'');
  });
}
document.querySelectorAll('#d-pri .pri-tag').forEach(function(el){
  el.addEventListener('click',function(){dPri=this.getAttribute('data-p');syncDPri();});
});

document.getElementById('d-ph-btn').addEventListener('click',function(){document.getElementById('d-file').click();});
document.getElementById('d-file').addEventListener('change',function(){addFiles(this.files,dPh,'d-preview');this.value='';});

document.getElementById('d-submit').addEventListener('click',function(){
  var loc=document.getElementById('d-loc').value.trim();if(!loc){toast('⚠️ 請填寫缺失位置');return;}
  defects.unshift({id:Date.now(),location:loc,type:dType,priority:dPri,desc:document.getElementById('d-desc').value.trim(),photos:dPh.slice(),fixPhotos:[],status:'pending',createdAt:todayStr()});
  saveD();dPh.length=0;document.getElementById('d-preview').innerHTML='';
  document.getElementById('d-loc').value='';document.getElementById('d-desc').value='';document.getElementById('d-file').value='';
  dType=dTypes[0]||'';dPri='urgent';renderDChips();syncDPri();toast('✅ 缺失記錄已新增');switchDTab('list');
});

document.getElementById('d-fs').addEventListener('change',renderDList);
document.getElementById('d-fp').addEventListener('change',renderDList);
document.getElementById('d-ft').addEventListener('change',renderDList);
document.getElementById('proj-name').addEventListener('input',function(){document.getElementById('proj-display').textContent=this.value||'工地管理';});

function renderDList(){
  rebuildDFT();
  var fs=document.getElementById('d-fs').value,ft=document.getElementById('d-ft').value,fp=document.getElementById('d-fp').value;
  var list=defects.filter(function(d){return(!fs||d.status===fs)&&(!ft||d.type===ft)&&(!fp||getPri(d)===fp);});
  list.sort(function(a,b){
    if (a.status !== b.status) return a.status === 'pending' ? -1 : 1;
    var pa = PO[getPri(a)], pb = PO[getPri(b)];
    if (pa === undefined) pa = 2;
    if (pb === undefined) pb = 2;
    if (pa !== pb) return pa - pb;
    return b.id - a.id;
  });
  document.getElementById('d-total').textContent=defects.length;
  document.getElementById('d-pending').textContent=defects.filter(function(d){return d.status==='pending';}).length;
  document.getElementById('d-done').textContent=defects.filter(function(d){return d.status==='done';}).length;
  var el=document.getElementById('defect-list');el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="empty">目前沒有缺失記錄</div>';return;}

  list.forEach(function(d){
    var pri=getPri(d),isEd=dEditing===d.id;
    var card=document.createElement('div');card.className='rcard pri-'+pri;

    // Header
    var hdr=document.createElement('div');hdr.className='rhdr';
    var left=document.createElement('div');
    var pb=document.createElement('span');pb.className='pri-badge';pb.style.background=PB[pri];pb.style.color=PC[pri];pb.textContent=PL[pri];
    var tt=document.createElement('div');tt.className='rtitle';tt.textContent=d.location;
    var mt=document.createElement('div');mt.className='rmeta';mt.textContent=d.type+' ・ '+d.createdAt;
    left.appendChild(pb);left.appendChild(tt);left.appendChild(mt);
    var bdg=document.createElement('span');bdg.className='badge '+(d.status==='pending'?'bp':'bd');bdg.textContent=d.status==='pending'?'待改善':'驗收完成';
    hdr.appendChild(left);hdr.appendChild(bdg);card.appendChild(hdr);

    // 編輯

    card.appendChild(ar);el.appendChild(card);
  });

function mkPhRow(photos,isEd,recId,field){
  var wrap=document.createElement('div');wrap.className='photo-row';
  photos.forEach(function(p,idx){
    var pw=document.createElement('div');pw.className='pw';
    var img=document.createElement('img');img.src=p;
    (function(i,arr){img.addEventListener('click',function(){openLb(arr,i);});})(idx,photos);
    pw.appendChild(img);
    if(isEd){
      var db=document.createElement('button');db.className='del-ph';db.textContent='×';
      (function(i,fld,rid){
        db.addEventListener('click',function(e){
          e.stopPropagation();
          defects=defects.map(function(x){if(x.id!==rid)return x;var c=Object.assign({},x);c[fld]=c[fld].filter(function(_,ii){return ii!==i;});return c;});

document.getElementById('p-word').addEventListener('click',function(){
  if(!progLogs.length){toast('⚠️ 沒有進度記錄');return;}
  var validLogs = progLogs.filter(function(p){return p.startDate&&p.endDate;});
  if(!validLogs.length){toast('⚠️ 記錄中沒有完整的日期');return;}
  var minDate=new Date('2099-12-31'), maxDate=new Date('1970-01-01');
  validLogs.forEach(function(p){
    var sd=new Date(p.startDate), ed=new Date(p.endDate);
    if(sd<minDate)minDate=sd;
    if(ed>maxDate)maxDate=ed;
  });
  var totalDays = (maxDate - minDate) / (1000*60*60*24) + 1;
  if(totalDays<1)totalDays=1;
  
  var rows = validLogs.map(function(p, i){
    var sd = new Date(p.startDate), ed = new Date(p.endDate);
    var offsetDays = (sd - minDate) / (1000*60*60*24);
    var durationDays = (ed - sd) / (1000*60*60*24) + 1;
    var leftPct = (offsetDays / totalDays) * 100;
    var widthPct = (durationDays / totalDays) * 100;
    
    var progWidth = p.progress + '%';
    var barColor = '#16A085';
    var st = getPStatus(p);
    if(st==='delay') barColor = '#C0392B';
    if(st==='done') barColor = '#27AE60';
    if(st==='pending') barColor = '#bbb';
    
    return '<tr style="border-bottom:1px solid #eee;"><td style="padding:10px;font-size:13px;width:160px;font-weight:600;vertical-align:middle;word-break:break-all;">'+esc(p.name)+'<div style="font-size:11px;color:#888;font-weight:normal;">'+p.startDate+'~'+p.endDate+'</div></td><td style="padding:10px;vertical-align:middle;"><div style="position:relative;width:100%;height:24px;background:#f5f5f5;border-radius:4px;"><div style="position:absolute;left:'+leftPct+'%;width:'+widthPct+'%;height:100%;background:rgba(0,0,0,0.05);border-radius:4px;border:1px solid #ddd;box-sizing:border-box;"><div style="width:'+progWidth+';height:100%;background:'+barColor+';border-radius:3px;display:flex;align-items:center;padding-left:6px;font-size:11px;color:#fff;font-weight:bold;white-space:nowrap;overflow:hidden;">'+(p.progress>0?p.progress+'%':'')+'</div></div></div></td></tr>';
  }).join('');
  
  var proj=document.getElementById('proj-name') ? (document.getElementById('proj-name').value||'工程進度') : '工程進度';
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>工程進度圖表</title><style>@page{size:A4 landscape;margin:15mm;}body{font-family:"Arial","微軟正黑體",sans-serif;font-size:13px;color:#111;}@media print{body{margin:0;} .no-print{display:none;}}</style></head><body><div class="no-print" style="background:#FFF3CD;color:#856404;padding:12px;text-align:center;margin-bottom:20px;border-radius:8px;font-weight:bold;">💡 提示：按 Ctrl+P (或 Cmd+P) 可以將此圖表列印成 PDF 檔案！</div><div style="border-bottom:3px solid #16A085;padding-bottom:10px;margin-bottom:20px;"><div style="font-size:20px;font-weight:700;color:#16A085;">'+esc(proj)+' - 進度甘特圖</div><div style="font-size:12px;color:#888;margin-top:4px;">匯出日期：'+todayStr()+'　總期程：'+minDate.toISOString().split('T')[0]+' ~ '+maxDate.toISOString().split('T')[0]+' ('+totalDays+'天)</div></div><table style="width:100%;border-collapse:collapse;table-layout:fixed;">'+rows+'</table></body></html>';
  dlBlob(new Blob([html],{type:'text/html;charset=utf-8'}),'進度圖表_'+todayStr().replace(/\//g,'')+'.html');
  toast('✅ 圖表已下載 (HTML格式)');
});
function getPStatus(p) {
  if (p.progress === 100) return 'done';
  var today = new Date().toISOString().split('T')[0];
  if (p.progress < 100 && today > p.endDate) return 'delay';
  if (p.progress === 0 && today < p.startDate) return 'pending';
  return 'ongoing';
}

function renderPList(){
  var fs=document.getElementById('p-fs').value;
  var list=progLogs.filter(function(p){return(!fs||getPStatus(p)===fs);});
  
  var order = {delay:0, ongoing:1, pending:2, done:3};
  list.sort(function(a,b){
    var sa = getPStatus(a), sb = getPStatus(b);
    if (sa !== sb) return order[sa] - order[sb];
    return new Date(a.startDate) - new Date(b.startDate);
  });

  document.getElementById('p-total').textContent=progLogs.length;
  document.getElementById('p-ongoing').textContent=progLogs.filter(function(p){return getPStatus(p)==='ongoing';}).length;
  document.getElementById('p-delay').textContent=progLogs.filter(function(p){return getPStatus(p)==='delay';}).length;
  
  var el=document.getElementById('progress-list');el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="empty">目前沒有進度記錄</div>';return;}

  list.forEach(function(p){
    var st = getPStatus(p);
    var stTxt = {delay:'⚠️ 延遲中', ongoing:'🔵 施工中', pending:'⏳ 未開始', done:'✅ 已完工'}[st];
    var stBg = {delay:'#FDECEA', ongoing:'#EEF5FC', pending:'#F5F5F5', done:'#EAF5EA'}[st];
    var stCol = {delay:'#C0392B', ongoing:'#185FA5', pending:'#666', done:'#27AE60'}[st];

    var card=document.createElement('div');card.className='rcard cp-card';
    if(st==='delay') card.style.borderLeftColor = '#C0392B';
    if(st==='done') card.style.borderLeftColor = '#27AE60';

    var hdr=document.createElement('div');hdr.className='rhdr';
    var left=document.createElement('div');
    var tt=document.createElement('div');tt.className='rtitle';tt.textContent=p.name;
    var mt=document.createElement('div');mt.className='rmeta';mt.textContent=(p.contractor?p.contractor+' ・ ':'')+p.startDate+' ~ '+p.endDate;
    left.appendChild(tt);left.appendChild(mt);
    var bdg=document.createElement('span');bdg.className='badge';bdg.style.background=stBg;bdg.style.color=stCol;bdg.textContent=stTxt;
    hdr.appendChild(left);hdr.appendChild(bdg);card.appendChild(hdr);

    if(p.desc){var dm=document.createElement('div');dm.style.cssText='font-size:13px;color:#666;margin:5px 0 8px;';dm.textContent=p.desc;card.appendChild(dm);}

    var pw=document.createElement('div');pw.className='prog-wrap';
    var pf=document.createElement('div');pf.className='prog-fill';pf.style.width=p.progress+'%';
    if(st==='delay') pf.style.background='#C0392B';
    if(st==='done') pf.style.background='#27AE60';
    var pt=document.createElement('div');pt.className='prog-header';
    pt.innerHTML='<span>進度</span><span>'+p.progress+'%</span>';
    
    pw.appendChild(pf);
    card.appendChild(pt);
    card.appendChild(pw);
    var isEd = pEditing === p.id;

    if(isEd){
      var ep=document.createElement('div');ep.className='ep';

      var nl=document.createElement('span');nl.className='ep-lbl';nl.textContent='工程項目';
      var ni=document.createElement('input');ni.type='text';ni.value=p.name;
      ep.appendChild(nl);ep.appendChild(ni);

      var cl=document.createElement('span');cl.className='ep-lbl';cl.textContent='負責廠商';
      var ci=document.createElement('input');ci.type='text';ci.value=p.contractor||'';
      ep.appendChild(cl);ep.appendChild(ci);

      var dr=document.createElement('div');dr.style.cssText='display:flex;gap:10px;';
      var sdWrap=document.createElement('div');sdWrap.style.flex='1';
      var sl=document.createElement('span');sl.className='ep-lbl';sl.textContent='開始';
      var si=document.createElement('input');si.type='date';si.value=p.startDate;
      sdWrap.appendChild(sl);sdWrap.appendChild(si);
      var edWrap=document.createElement('div');edWrap.style.flex='1';
      var elbl=document.createElement('span');elbl.className='ep-lbl';elbl.textContent='預計完工';
      var ei=document.createElement('input');ei.type='date';ei.value=p.endDate;
      edWrap.appendChild(elbl);edWrap.appendChild(ei);
      dr.appendChild(sdWrap);dr.appendChild(edWrap);
      ep.appendChild(dr);

      var dl=document.createElement('span');dl.className='ep-lbl';dl.textContent='備註';
      var ta=document.createElement('textarea');ta.value=p.desc||'';
      ep.appendChild(dl);ep.appendChild(ta);

      var saveBtn=document.createElement('button');saveBtn.className='ep-save';saveBtn.style.background='#16A085';saveBtn.textContent='儲存';
      (function(id,n_inp,c_inp,s_inp,e_inp,d_ta){
        saveBtn.addEventListener('click',function(){
          var nn=n_inp.value.trim();if(!nn){toast('⚠️ 項目不可空白');return;}
          progLogs=progLogs.map(function(x){return x.id===id?Object.assign({},x,{name:nn,contractor:c_inp.value.trim(),startDate:s_inp.value,endDate:e_inp.value,desc:d_ta.value.trim()}):x;});
          saveP();pEditing=null;toast('✅ 已儲存');renderPList();
        });
      })(p.id,ni,ci,si,ei,ta);
      ep.appendChild(saveBtn);
      card.appendChild(ep);
    }

    var ar=document.createElement('div');ar.className='ar';
    var sld=document.createElement('input');sld.type='range';sld.min='0';sld.max='100';sld.value=p.progress;
    sld.style.flex='1';sld.style.marginTop='4px';
    sld.addEventListener('change', function(){
      var val = parseInt(this.value, 10);
      progLogs=progLogs.map(function(x){return x.id===p.id?Object.assign({},x,{progress:val}):x;});
      saveP();renderPList();
    });
    
    (function(id){
      var b=document.createElement('button');b.className='abtn';b.style.color='#444';b.style.flex='none';b.style.padding='4px 12px';b.textContent=isEd?'取消':'編輯';
      b.addEventListener('click',function(){pEditing=(pEditing===id)?null:id;renderPList();});
      ar.appendChild(b);
    })(p.id);

    var dbBtn=document.createElement('button');dbBtn.className='abtn';dbBtn.style.color='#C0392B';dbBtn.style.flex='none';dbBtn.style.padding='4px 12px';dbBtn.textContent='刪除';
    dbBtn.addEventListener('click',function(){
      dlg('確認刪除','確定刪除「'+p.name+'」進度記錄嗎？','確定刪除','#C0392B',function(){
        progLogs=progLogs.filter(function(x){return x.id!==p.id;});saveP();toast('已刪除');renderPList();
      });
    });

    ar.appendChild(sld);
    ar.appendChild(dbBtn);
    card.appendChild(ar);

    el.appendChild(card);
  });
}

document.getElementById('btn-backup').addEventListener('click',function(){
  var data={defects:defects,safetyLogs:safetyLogs,matLogs:matLogs,progLogs:progLogs,dTypes:dTypes,sTypes:sTypes,mTypes:mTypes,exportedAt:todayStr()};
  dlBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'工地備份_'+todayStr().replace(/\//g,'')+'.json');toast('✅ 備份已下載');
});
document.getElementById('restore-inp').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      dlg('確認還原','確定還原備份？目前資料將被覆蓋。','確定還原','#185FA5',function(){
        if(data.defects)defects=data.defects;
        if(data.safetyLogs)safetyLogs=data.safetyLogs;
        if(data.matLogs)matLogs=data.matLogs;
        if(data.progLogs)progLogs=data.progLogs;
        if(data.dTypes){dTypes=data.dTypes;saveDT();}
        if(data.sTypes){sTypes=data.sTypes;saveST();}
        if(data.mTypes){mTypes=data.mTypes;saveMT();}
        saveD();saveS();saveM();saveP();renderDList();toast('✅ 備份已還原');
      });
    }catch(e){toast('⚠️ 讀取備份失敗');}
  };r.readAsText(f);this.value='';
});

document.getElementById('btn-reset').addEventListener('click',function(){
  dlg('警告：清空所有資料','確定要刪除所有缺失、巡檢與驗收記錄嗎？此動作無法復原！','確定清空','#C0392B',function(){
    localStorage.clear();
    location.reload();
  });
});

function renderWeek() {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var day = today.getDay(); 
  var sun = new Date(today);
  sun.setDate(today.getDate() - day);
  var strip = document.getElementById('week-strip');
  strip.innerHTML = '';
  var dayNames = ['週日','週一','週二','週三','週四','週五','週六'];
  for(var i=0; i<7; i++){
    var d = new Date(sun);
    d.setDate(sun.getDate() + i);
    var cell = document.createElement('div');
    cell.className = 'day-cell' + (d.getTime() === today.getTime() ? ' today' : '');
    var name = document.createElement('div');
    name.className = 'day-name';
    name.textContent = dayNames[i];
    var num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d.getDate();
    cell.appendChild(name);
    cell.appendChild(num);
    strip.appendChild(cell);
  }
}
